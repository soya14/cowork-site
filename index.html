<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cathay Site</title>
  <meta name="description" content="A simple site ready for GitHub Pages deployment.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">GitHub Pages Ready</p>
      <h1>這個網站已經可以部署到 GitHub Pages</h1>
      <p class="lead">
        你可以直接修改這個 HTML 內容，之後把整個資料夾推到 GitHub，
        就能用公開網址直接開啟。
      </p>
      <div class="actions">
        <a class="button primary" href="https://github.com/" target="_blank" rel="noreferrer">前往 GitHub</a>
        <a class="button secondary" href="./README.md">查看部署說明</a>
      </div>
    </section>

    <section class="card-grid">
      <article class="card">
        <h2>1. 編輯內容</h2>
        <p>修改這個 <code>index.html</code> 與 <code>style.css</code>，換成你自己的網站內容。</p>
      </article>
      <article class="card">
        <h2>2. 上傳 GitHub</h2>
        <p>建立 GitHub repository，然後把這個資料夾 push 上去。</p>
      </article>
      <article class="card">
        <h2>3. 開啟 Pages</h2>
        <p>在 repository 的 Settings → Pages 啟用 GitHub Pages。</p>
      </article>
    </section>
  </main>
</body>
</html>
